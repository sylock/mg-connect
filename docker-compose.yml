services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: salon_team
      POSTGRES_USER: salon_team
      POSTGRES_PASSWORD: salon_team_dev
    ports:
      - "5432:5432"
    volumes:
      - salon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon_team -d salon_team"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  salon_pgdata:
