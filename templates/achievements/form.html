{% extends "base.html" %}
{% block content %}
<section class="stack gap-4 max-w-xl">
  <form method="post" enctype="multipart/form-data" class="stack gap-4" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}
    <div class="alert alert-error">{{ form.non_field_errors }}</div>
    {% endif %}
    {% for field in form %}
      {% if field.is_hidden %}
        {{ field }}
      {% else %}
      <label class="form-control w-full">
        <span class="label-text">{{ field.label }}</span>
        {{ field }}
        {% if field.help_text %}<span class="muted text-sm">{{ field.help_text }}</span>{% endif %}
        {% if field.errors %}<span class="field-error">{{ field.errors|striptags }}</span>{% endif %}
      </label>
      {% endif %}
    {% endfor %}
    <div class="action-row">
      <button type="submit" class="btn btn-primary">Envoyer</button>
      <a class="btn btn-ghost" href="{% url 'achievements:list' %}">Annuler</a>
    </div>
  </form>
</section>
{% endblock %}
